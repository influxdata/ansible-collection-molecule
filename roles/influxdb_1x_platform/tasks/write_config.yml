---
# Write platform configuration to molecule ephemeral storage
#
# Optional variables:
#  - __influxdb1x_platform_config_content: Updated platform configuration to write to file
#

- name: State | DEBUG | Show run configuration
  ansible.builtin.debug:
    var: influxdb1x_platform_run_config
    verbosity: 1

- name: State | DEBUG | Show updated platform configuration
  ansible.builtin.debug:
    var: __influxdb1x_platform_config_content
    verbosity: 1

- name: State | Validate | Platform configuration
  when: __influxdb1x_platform_config_content.platforms is defined
  loop: "{{ __influxdb1x_platform_config_content.platforms }}"
  loop_control:
    loop_var: __influxdb1x_platform
    label: "{{ __influxdb1x_platform.name | default('Platform name undefined') }}"
  ansible.builtin.assert:
    that:
      - __influxdb1x_platform.name is defined
    fail_msg: "Platform name not defined. Please specify a name for all platforms to be modified."
    success_msg: "Platform name defined."

- name: State | Write run config to file
  ansible.builtin.template:
    src: influxdb1x-platform-run-config.yml.j2
    dest: "{{ influxdb1x_platform_run_config_path }}"
    mode: "0600"

