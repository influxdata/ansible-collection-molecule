---
# Remove AWS security group managed by this role
#
# Expected input vars:
#  __influxdb1x_platform_cfg: The platform configuration to remove
#

- name: Destroy AWS SG | 🐜 | Show platform configuration
  ansible.builtin.debug:
    var: __influxdb1x_platform_cfg
    verbosity: 1

- name: Security group is ephemeral
  # At present we only support deletion of auto-generated ephemeral security groups
  when: __influxdb1x_platform_cfg.security_groups | default([]) | length == 0
  block:
    - name: Destroy AWS SG | Search for existing group
      when: __influxdb1x_platform_cfg.vpc_id is not defined
      amazon.aws.ec2_security_group_info:
        profile: "{{ __influxdb1x_platform.aws_profile | default(omit) }}"
        access_key: "{{ __influxdb1x_platform.aws_access_key_id | default(omit) }}"
        secret_key: "{{ __influxdb1x_platform.aws_secret_access_key | default(omit) }}"
        session_token: "{{ __influxdb1x_platform.aws_session_token | default(omit) }}"
        region: "{{ __influxdb1x_platform_cfg.region }}"
        filters:
          "tag:molecule-run-id": "{{ __influxdb1x_platform_cfg.internal_id }}"
          "tag:Name": "{{ __influxdb1x_platform_cfg.security_group_name }}"
      register: __influxdb1x_platform_sg_lookup_info

    - name: Destroy AWS SG | 🐜 | Show existing security group data
      when: __influxdb1x_platform_sg_lookup_info is not skipped
      ansible.builtin.debug:
        var: __influxdb1x_platform_sg_lookup_info
        verbosity: 1

    - name: Destroy AWS SG | Destroy ephemeral security groups (if needed)
      when: __influxdb1x_platform_cfg.vpc_id is defined or __influxdb1x_platform_sg_lookup_info.security_groups | length > 0
      amazon.aws.ec2_security_group:
        profile: "{{ __influxdb1x_platform.aws_profile | default(omit) }}"
        access_key: "{{ __influxdb1x_platform.aws_access_key_id | default(omit) }}"
        secret_key: "{{ __influxdb1x_platform.aws_secret_access_key | default(omit) }}"
        session_token: "{{ __influxdb1x_platform.aws_session_token | default(omit) }}"
        region: "{{ __influxdb1x_platform_cfg.region }}"
        vpc_id: >-
          {{
            __influxdb1x_platform_cfg.vpc_id
            | default(__influxdb1x_platform_sg_lookup_info.security_groups
            | map(attribute='vpc_id') | first)
          }}
        name: "{{ __influxdb1x_platform_cfg.security_group_name }}"
        state: absent

