---
# Create a cluster using a centralized orchestrator

- name: Create any new clusters that don't yet exist
  vars:
    __influxdb1x_new_platforms: >-
      {{
        __influxdb1x_platforms | selectattr('cluster_id', 'defined')
        | selectattr('cluster_id', 'falsy')
        + __influxdb1x_platforms | selectattr('cluster_id', 'undefined')
        | list
      }}
  block:
    - name: Create | 🐜 DEBUG | Show new platforms
      loop: "{{ __influxdb1x_new_platforms }}"
      loop_control:
        loop_var: __influxdb1x_platform
        label: "{{ __influxdb1x_platform.name }}"
      ansible.builtin.debug:
        var: __influxdb1x_platform
        verbosity: 1

    - name: Create | Provision InfluxDB 1.x Enterprise cluster
      loop: "{{ __influxdb1x_new_platforms }}"
      loop_control:
        loop_var: __influxdb1x_platform
        label: "{{ __influxdb1x_platform.name }}"
      ansible.builtin.uri:
        url: "{{ __influxdb1x_orchestrator_api_url }}/clusters"
        body_format: json
        body: "{{ __influxdb1x_platform.cluster_config | to_json }}"
        method: POST
        user: "{{ __influxdb1x_platform.orchestrator_username }}"
        password: "{{ __influxdb1x_platform.orchestrator_password }}"
        status_code:
          - 200
          - 201
      register: __influxdb1x_platform_cluster_creation_orchestrator_responses

    - name: Create | DEBUG | Show cluster creation responses
      ansible.builtin.debug:
        var: __influxdb1x_platform_cluster_creation_orchestrator_responses
        verbosity: 1

    - name: Create | Extract cluster creation responses
      loop: "{{ __influxdb1x_platform_cluster_creation_orchestrator_responses.results }}"
      loop_control:
        loop_var: __influxdb1x_platform_cluster_creation_orchestrator_response
        label: "{{ __influxdb1x_platform_cluster_creation_orchestrator_response.__influxdb1x_platform.name }}"
      when: __influxdb1x_platform_cluster_creation_orchestrator.status == 201
      ansible.builtin.set_fact:
        __influxdb1x_platform_creation_responses: "{{ __influxdb1x_platform_creation_responses | default([]) +
          [__influxdb1x_platform_cluster_creation_orchestrator_response.json | combine({
            'molecule_platform_name': __influxdb1x_platform_cluster_creation_orchestrator_response.__influxdb1x_platform.name, recursive=True
          })] }}"

    - name: Create | Show cluster creation response
      ansible.builtin.debug:
        var: __influxdb1x_platform_creation_responses
        verbosity: 1

    - name: New cluster is created
      when:
        - __influxdb1x_platform_creation_responses.skipped | default(false) is false
        - __influxdb1x_platform_creation_responses | length > 0
      block:
        - name: Create | Validate cluster creation response
          loop: "{{ __influxdb1x_platform_cluster_creation_orchestrator_responses.results }}"
          loop_control:
            loop_var: __influxdb1x_platform_creation_response
            label: "{{ __influxdb1x_platform_creation_response.__influxdb1x_platform.name }}"
          ansible.builtin.assert:
            that:
              - __influxdb1x_platform_creation_response is mapping
              - __influxdb1x_platform_creation_response.id is string and __influxdb1x_platform_creation_response.id | length > 0
              - __influxdb1x_platform_creation_response.machines_status is string
            fail_msg: "Cluster creation failed with response: {{ __influxdb1x_platform_cluster_creation_potato_response }}"
            success_msg: "Cluster creation request successful"

        - name: Create | Write run config to file
          vars:
            __influxdb1x_platform_config_content:
              platforms: >-
                {% for __influxdb1x_new_cluster in __influxdb1x_platform_creation_responses %}
                  - name: "{{ __influxdb1x_new_cluster.name }}"
                    cluster_id: "{{ __influxdb1x_new_cluster.id }}"
                {% endfor %}
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/write_config.yml"

- name: Create | Wait for cluster creation to complete
  loop: "{{ __influxdb1x_platforms | selectattr('ignore_machines_status', 'eq', false) }}"
  loop_control:
    loop_var: __influxdb1x_platform
    label: "{{ __influxdb1x_platform.name }}"
  ansible.builtin.uri:
    url: "{{ __influxdb1x_orchestrator_api_url }}/clusters/{{ __influxdb1x_platform.cluster_id }}"
    method: GET
    user: "{{ __influxdb1x_platform.orchestrator_username }}"
    password: "{{ __influxdb1x_platform.orchestrator_password }}"
    return_content: true
  register: __influxdb1x_platform_cluster_creation_status
  until: __influxdb1x_platform_cluster_creation_status.json.machines_status == __influxdb1x_platform.desired_machines_status
  retries: "{{ (__influxdb1x_platform.creation_timeout | int / 10) | int }}"
  delay: 10
  async: "{{ __influxdb1x_platform.creation_timeout | int + 10 }}"

- name: Create | Wait for cluster creation timeout (ignore orchestrator reported status)
  loop: "{{ __influxdb1x_platforms | selectattr('ignore_machines_status', 'eq', true) }}"
  loop_control:
    loop_var: __influxdb1x_platform
    label: "{{ __influxdb1x_platform.name }}"
  ansible.builtin.wait_for:
    timeout: "{{ __influxdb1x_platform.creation_timeout }}"
  async: "{{ __influxdb1x_platform.creation_timeout | int + 10 }}"


- name: Create | Collect cluster instance EC2 data
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/collect_ec2_data.yml"

# Orchestrator can fail to create all instances due to unsupported instance types in the (randomly-selected) availability zone
- name: Create | Validate cluster member count
  ansible.builtin.assert:
    that:
      - __influxdb1x_platform_new_ec2_instances.instances | length >= (__influxdb1x_platform_creation_response.data_node_count | int + __influxdb1x_platform_creation_response.meta_node_count | int)
    fail_msg: "Cluster creation failed to create all instances! Check cluster orchestrator logs for more information."
    success_msg: "Expected number of EC2 instances discovered."

- name: Show existing instances
  ansible.builtin.debug:
    var: __influxdb1x_platform_existing_ec2_instances
    verbosity: 1

- name: STOP HERE
  ansible.builtin.fail:
    msg: "STOP HERE"

- name: Modify EC2 instances
  vars:
    __influxdb1x_platform_ec2_instances: "{{ __influxdb1x_platform_existing_ec2_instances if __influxdb1x_platform_new_ec2_instances.skipped |
      default(false) else __influxdb1x_platform_new_ec2_instances }}"
  block:
    - name: Show target ec2 instances
      ansible.builtin.debug:
        var: __influxdb1x_platform_ec2_instances
        verbosity: 2

    - name: Collect instance configs
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/collect_ec2_data.yml"
      loop: "{{ __influxdb1x_platform_ec2_instances.instances }}"
      loop_control:
        loop_var: __influxdb1x_platform_instance
        label: "{{ __influxdb1x_platform_instance.instance_id }}"

    - name: SSH private key exists in Molecule config
      ansible.builtin.copy:
        src: "{{ __influxdb1x_platform_cfg.private_key_source_path }}"
        dest: "{{ __influxdb1x_platform_cfg.private_key_path }}"
        mode: "0600"

    - name: Check SSH connectivity
      ansible.builtin.wait_for:
        host: "{{ __influxdb1x_platform_instance.public_ip_address }}"
        port: "{{ __influxdb1x_platform_cfg.ssh_port }}"
        search_regex: SSH
        delay: 10
        timeout: 320
      async: 350
      poll: 0
      register: __influxdb1x_platform_ssh_connectivity_check
      loop: "{{ __influxdb1x_platform_ec2_instances.instances }}"
      loop_control:
        loop_var: __influxdb1x_platform_instance
        label: "{{ __influxdb1x_platform_instance.instance_id }}"

    - name: Show SSH connectivity check results
      ansible.builtin.debug:
        var: __influxdb1x_platform_ssh_connectivity_check
        verbosity: 1

    - name: Wait for SSH connectivity checks to finish
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/check_async_tasks.yml"
      loop: "{{ __influxdb1x_platform_ssh_connectivity_check.results }}"
      loop_control:
        loop_var: __influxdb1x_platform_async_job
        label: "{{ __influxdb1x_platform_async_job.__influxdb1x_platform_instance.instance_id }}"

# TODO: Add an actual check here instead of only waiting
- name: Wait for boot process to finish
  ansible.builtin.pause:
    seconds: "{{ __influxdb1x_platform_cfg.boot_wait_seconds }}"

