---
# Create a cluster using a centralized orchestrator

- name: Create any new clusters that don't yet exist
  vars:
    __influxdb1x_new_platforms: >-
      {{
        __influxdb1x_platforms | selectattr('cluster_id', 'defined')
        | selectattr('cluster_id', 'falsy')
        + __influxdb1x_platforms | selectattr('cluster_id', 'undefined')
        | list
      }}
  block:
    - name: Create | 🐜 DEBUG | Show new platforms
      loop: "{{ __influxdb1x_new_platforms }}"
      loop_control:
        loop_var: __influxdb1x_platform
        label: "{{ __influxdb1x_platform.name }}"
      ansible.builtin.debug:
        var: __influxdb1x_platform
        verbosity: 1

    - name: Create | Provision InfluxDB 1.x Enterprise cluster
      loop: "{{ __influxdb1x_new_platforms }}"
      loop_control:
        loop_var: __influxdb1x_platform
        label: "{{ __influxdb1x_platform.name }}"
      ansible.builtin.uri:
        url: "{{ __influxdb1x_orchestrator_api_url }}/clusters"
        body_format: json
        body: "{{ __influxdb1x_platform.cluster_config | to_json }}"
        method: POST
        user: "{{ __influxdb1x_platform.orchestrator_username }}"
        password: "{{ __influxdb1x_platform.orchestrator_password }}"
        status_code:
          - 200
          - 201
      register: __influxdb1x_platform_cluster_creation_orchestrator_responses

    - name: Create | DEBUG | Show cluster creation responses
      ansible.builtin.debug:
        var: __influxdb1x_platform_cluster_creation_orchestrator_responses
        verbosity: 1

    - name: New cluster is created
      when:
        - __influxdb1x_platform_cluster_creation_orchestrator_responses.skipped | default(false) is false
        - __influxdb1x_platform_cluster_creation_orchestrator_responses.results | length > 0
      block:
        - name: Create | Validate cluster provisioning response
          loop: "{{ __influxdb1x_platform_cluster_creation_orchestrator_responses.results }}"
          loop_control:
            loop_var: __influxdb1x_platform_provisioning_response
            label: "{{ __influxdb1x_platform_provisioning_response.__influxdb1x_platform.name }}"
          ansible.builtin.assert:
            that:
              - __influxdb1x_platform_provisioning_response is mapping
              - __influxdb1x_platform_provisioning_response.json.id is string
                and __influxdb1x_platform_provisioning_response.json.id | length > 0
              - __influxdb1x_platform_provisioning_response.json.machines_status is string
            fail_msg: >-
              Cluster creation failed with response:
              {{
                __influxdb1x_platform_provisioning_response.msg
               | default(__influxdb1x_platform_provisioning_response)
              }}
            success_msg: "Cluster creation request successful"

        - name: Create | Store orchestrator cluster data
          vars:
            __influxdb1x_platform_config_content:
              platforms: >-
                {%- set __influxdb1x_platform_output = [] -%}
                {%- for __influxdb1x_platform_cluster_creation_orchestrator_response
                  in __influxdb1x_platform_cluster_creation_orchestrator_responses.results
                  | selectattr('status', 'eq', 201) -%}
                  {%- set _ = __influxdb1x_platform_output.append({
                    'name': __influxdb1x_platform_cluster_creation_orchestrator_response.__influxdb1x_platform.name,
                    'cluster_id': __influxdb1x_platform_cluster_creation_orchestrator_response.json.id,
                    'orchestrator_data': __influxdb1x_platform_cluster_creation_orchestrator_response.json
                  }) -%}
                {%- endfor -%}
                {{ __influxdb1x_platform_output }}
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/write_config.yml"

- name: Wait for cluster creation to complete
  vars:
    __influxdb1x_platforms_watch_status: "{{ __influxdb1x_platforms | selectattr('ignore_machines_status', 'eq', false) }}"
    __influxdb1x_platforms_watch_timeout: "{{ __influxdb1x_platforms | selectattr('ignore_machines_status', 'eq', true) }}"
  block:
    - name: Set cluster creation start time
      when: __influxdb1x_platforms_watch_status | length > 0
      set_fact:
        __influxdb1x_platform_cluster_creation_start: "{{ lookup('pipe', 'date +%s')|int }}"

    - name: Create | Wait for cluster creation to complete
      loop: "{{ __influxdb1x_platforms_watch_status }}"
      loop_control:
        loop_var: __influxdb1x_platform
        label: "{{ __influxdb1x_platform.name }}"
      ansible.builtin.uri:
        url: "{{ __influxdb1x_orchestrator_api_url }}/clusters/{{ __influxdb1x_platform.cluster_id }}"
        method: GET
        user: "{{ __influxdb1x_platform.orchestrator_username }}"
        password: "{{ __influxdb1x_platform.orchestrator_password }}"
        return_content: true
      register: __influxdb1x_platform_cluster_creation_status
      until: __influxdb1x_platform_cluster_creation_status.json.machines_status == __influxdb1x_platform.desired_machines_status
      retries: "{{ (__influxdb1x_platform.creation_timeout | int / 10) | int }}"
      delay: 10
      async: "{{ __influxdb1x_platform.creation_timeout | int + 10 }}"

    - name: Set cluster creation end time
      when: __influxdb1x_platform_cluster_creation_status is changed
      set_fact:
        __influxdb1x_platform_cluster_creation_end: "{{ lookup('pipe', 'date +%s')|int }}"

    - name: Create | Wait for cluster creation timeout (ignore orchestrator reported status)
      vars:
        __influxdb1x_platform_max_creation_timeout: >-
          {{
            __influxdb1x_platforms
            | map(attribute='creation_timeout')
            | max
            | int
          }}
        __influxdb1x_platform_remaining_wait: >-
          {{
            [
              0,
              (
                __influxdb1x_platform_max_creation_timeout | int
              )
              - (
                  (__influxdb1x_platform_cluster_creation_end|default(__influxdb1x_platform_cluster_creation_start|default(0)))|int
                  -
                  (__influxdb1x_platform_cluster_creation_start|default(0))|int
                )
            ]|max
          }}
      ansible.builtin.wait_for:
        timeout: "{{ __influxdb1x_platform_remaining_wait }}"

- name: Create | Collect cluster instance EC2 data
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/collect_ec2_data.yml"

# Orchestrator can fail to create all instances due to unsupported instance types in the (internally-selected) availability zone
- name: Create | Validate cluster member count
  loop: "{{ __influxdb1x_platforms | selectattr('ignore_machines_status', 'eq', true) }}"
  loop_control:
    loop_var: __influxdb1x_platform
    label: "{{ __influxdb1x_platform.name }}"
  vars:
    __influxdb1x_platform_hosts: >-
      {{
        __influxdb1x_platform_instance_configs
        | selectattr('instance', 'equalto', __influxdb1x_platform.name)
        | list
      }}
    __influxdb1x_platform_min_node_count: >-
      {{
        __influxdb1x_platform.cluster_config.data_node_count| int
        + __influxdb1x_platform.cluster_config.meta_node_count | int
      }}
  ansible.builtin.assert:
    that:
      - __influxdb1x_platform_hosts | length >= __influxdb1x_platform_min_node_count | int
    fail_msg: >
      Cluster creation failed to create all instances!
      Found {{ __influxdb1x_platform_hosts | length }} of {{ __influxdb1x_platform_min_node_count }} expected.
      Check cluster orchestrator logs for more information.
    success_msg: "Expected number of EC2 instances ({{ __influxdb1x_platform_hosts | length }}) discovered."

