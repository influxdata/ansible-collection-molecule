---
# Restart non-running containers and verify health
#
# Expected input:
#   __docker_platform_failed_names: List of container names that are not running
#   __docker_platform_retry_attempt: Current retry attempt number
#   docker_platform_create_retry_delay: Seconds to wait after restart before health check
#

- name: "Create Platform | Restart attempt {{ __docker_platform_retry_attempt }} - Restarting {{ __docker_platform_failed_names | length }} container(s)"
  loop: "{{ __docker_platform_failed_names }}"
  loop_control:
    loop_var: __docker_platform_restart_name
    label: "{{ __docker_platform_restart_name }}"
  ansible.builtin.command:
    cmd: "docker restart {{ __docker_platform_restart_name }}"
  changed_when: true

- name: "Create Platform | Restart attempt {{ __docker_platform_retry_attempt }} - Waiting {{ docker_platform_create_retry_delay }}s for containers to initialize"
  ansible.builtin.wait_for:
    timeout: "{{ docker_platform_create_retry_delay }}"

- name: "Create Platform | Restart attempt {{ __docker_platform_retry_attempt }} - Verifying container health"
  loop: "{{ __docker_platform_failed_names }}"
  loop_control:
    loop_var: __docker_platform_verify_name
    label: "{{ __docker_platform_verify_name }}"
  ansible.builtin.command:
    cmd: >-
      docker inspect
        --format {% raw %}'{{.State.Running}}'{% endraw %}
        {{ __docker_platform_verify_name }}
  register: __docker_platform_verify_results
  changed_when: false

- name: "Create Platform | Restart attempt {{ __docker_platform_retry_attempt }} - Updating failed container list"
  ansible.builtin.set_fact:
    __docker_platform_failed_names: >-
      {{
        __docker_platform_verify_results.results
        | selectattr('stdout', 'ne', 'true')
        | map(attribute='__docker_platform_verify_name')
        | list
      }}
