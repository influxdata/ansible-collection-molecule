---
role_name_check: 0
dependency:
  name: galaxy
driver:
  name: default
  options:
    managed: true
platforms:
  - name: influxdb1x-platform-al2
    type: influxdb_1x
    region: us-west-2
    orchestrator_address: https://potato.a.influxcloud.us
    #private_key_source_path: "~/.ssh/_caroline-c1-dev"
    ssh_user: ec2-user
    ssh_port: 22
    cluster_config:
      ami: ami-0edf4a7e3058418ad
      config_tag: 1.11.6.1-staging-pro
      init: latest
    ignore_machines_status: true
    creation_timeout: 120
    hostvars: {}
  - name: influxdb1x-platform-rocky
    type: influxdb_1x
    region: us-west-2
    orchestrator_address: https://potato.a.influxcloud.us
    #private_key_source_path: "~/.ssh/_caroline-c1-dev"
    ssh_user: rocky
    ssh_port: 22
    cluster_config:
      config_tag: 1.11.6.1-staging-pro
      ami: ami-0c532acdba3db3e90
      init: latest
    ignore_machines_status: true
    creation_timeout: 240
    hostvars: {}
provisioner:
  name: ansible
  log: True
  playbooks:
    create: ../resources/create.yml
    prepare: prepare.yml
    converge: converge.yml
    side_effect: ../resourcs/side_effect.yml
    verify: verify.yml
    cleanup: ../resources/cleanup.yml
    destroy: ../resources/destroy.yml
  config_options:
    defaults:
      gathering: explicit
      playbook_vars_root: top
      verbosity: ${ANSIBLE_VERBOSITY:-0}
  env:
    ARA_API_CLIENT: ${ARA_API_CLIENT:-'http'}
    ARA_API_SERVER: ${ARA_API_SERVER:-'http://localhost:8000'}
    ARA_DEFAULT_LABELS: ${ARA_DEFAULT_LABELS:-'testing,molecule'}
    # To use Ara with molecule:
    #  export the ANSIBLE_CALLBACK_PLUGINS env var with the output of 'python3 -m ara.setup.callback_plugins'
    ANSIBLE_CALLBACK_PLUGINS: ${ANSIBLE_CALLBACK_PLUGINS}
scenario:
  create_sequence:
    - dependency
    - create
    - prepare
  check_sequence:
    - dependency
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - dependency
    - create
    - prepare
    - converge
  destroy_sequence:
    - dependency
    - cleanup
    - destroy
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
  enabled: true

