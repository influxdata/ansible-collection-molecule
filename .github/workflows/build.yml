---

name: Test and release branch
on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel
  # Molecule is tracked unpinned; a weekly run surfaces breaking upstream releases
  # here rather than in a consumer's unrelated pull request.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      runner-type:
        required: true
        description: 'Type of Github runner to use for the test'
        type: string
        default: 'ubuntu-latest'
      log-level:
        required: true
        description: 'Log level for the test'
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ github.event.inputs.runner-type || 'ubuntu-latest' }}
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]
        molecule-scenario:
          - default
          - ec2_platform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install molecule ansible-lint requests boto3[crt]
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # WARNING: This could cause ansible environment conflicts with other (unrelated) tests on non-ephemeral runners
      - name: Build and install collection
        run: |
          ansible-galaxy collection build --force
          ansible-galaxy collection install --force *-molecule-*.tar.gz

      - name: Log into AWS
        if: ${{ matrix.molecule-scenario == 'ec2_platform' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Test with molecule
        env:
          # Make molecule output colored content (easier to read via GH UI)
          PY_COLORS: 1
          ANSIBLE_FORCE_COLOR: 1
          ANSIBLE_VERBOSITY: ${{ github.event.inputs.log-level || '0' }}
          ORCHESTRATOR_ADDRESS: ${{ vars.ORCHESTRATOR_ADDRESS }}
          ORCHESTRATOR_API_USERNAME: ${{ vars.ORCHESTRATOR_API_USERNAME }}
          MOLECULE_SSH_PRIVATE_KEY: ${{ secrets.MOLECULE_SSH_PRIVATE_KEY }}
          ORCHESTRATOR_API_PASSWORD: ${{ secrets.ORCHESTRATOR_API_PASSWORD }}
        run: |
          molecule test -s ${{ matrix.molecule-scenario }}

  deploy:
    runs-on: ${{ github.event.inputs.runner-type || 'ubuntu-latest' }}
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create and Push Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_NAME=${{ github.ref_name }}
          echo "Creating tag $TAG_NAME"
          # Configure Git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create the tag
          git tag "$TAG_NAME"
          # Push the tag to the repository
          git push origin "refs/tags/$TAG_NAME" --force

